<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29 Ekim Cumhuriyet Bayramı</title>
    <!-- Şık yazı tipleri için Google Fonts bağlantıları -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #E30A17; /* Türk Bayrağı Kırmızısı */
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }
        h2 {
            font-weight: 300;
            font-size: 1.5rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }
        .image-gallery img {
            width: 100%;
            max-width: 350px;
            border-radius: 8px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease;
        }
        .image-gallery img:hover {
            transform: scale(1.05);
        }
        .quote {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-style: italic;
            margin: 40px 0;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .signature {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 15px;
            font-family: 'Montserrat', sans-serif;
            font-style: normal;
        }
        footer {
            margin-top: 60px;
            font-size: 0.9rem;
            opacity: 0.8;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>29 Ekim Cumhuriyet Bayramımız Kutlu Olsun!</h1>
        <h2>"Cumhuriyet, bilhassa kimsesizlerin kimsesidir."</h2>
        
        <div class="image-gallery">
            <!-- GitHub'a yükleyeceğin görseller projeden çekiliyor -->
            <img src="29 Ekim.png" alt="Mustafa Kemal Atatürk">
            <img src="29 Ekim1.png" alt="Mustafa Kemal Atatürk ve Cumhuriyet">
        </div>

        <div class="quote">
            "Ey yükselen yeni nesil! İstikbal sizsiniz. Cumhuriyeti biz kurduk, onu yükseltecek ve yaşatacak sizsiniz."
            <div class="signature">- Mustafa Kemal Atatürk</div>
        </div>
        
        <footer>
            Bu proje 29 Ekim anısına sevgi, saygı ve minnetle hazırlanmıştır.
        </footer>
    </div>
</body>
</html>
